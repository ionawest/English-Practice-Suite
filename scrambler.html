<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Paragraph Scrambler</title>
    <script src="data_scrambler.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; align-items: center; padding: 50px 20px; margin: 0; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; text-align: center; }
        h1 { color: #2c3e50; margin-top: 0; }
        .setup-screen, .game-screen, .end-screen { display: none; }
        .active { display: block; }
        
        .setup-controls { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; align-items: center; }
        .input-group { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
        .input-group label { font-weight: bold; margin-bottom: 5px; text-align: center; color: #2c3e50;}
        input[type="number"], select { padding: 10px; font-size: 16px; width: 100%; border: 1px solid #ccc; border-radius: 6px; text-align: center; background-color: #fff; }

        button { background-color: #e67e22; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s ease; width: 100%; max-width: 300px; display: block; margin: 10px auto; font-weight: bold; }
        button:hover { background-color: #d35400; }

        /* Specific Button Styles */
        #nextBtn { background-color: #27ae60; display: none; }
        #nextBtn:hover { background-color: #2ecc71; }
        #showAnswerBtn { background-color: #7f8c8d; margin-top: 10px; }
        #showAnswerBtn:hover { background-color: #636e72; }
        
        .button-group { display: flex; flex-direction: column; align-items: center; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;}

        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 18px; color: #7f8c8d; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        .topic-display { font-size: 20px; font-weight: bold; color: #2980b9; margin-bottom: 20px; text-align: left;}
        .instruction-text { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; text-align: left; font-style: italic; }

        /* Scrambler specific UI */
        .sortable-list { display: flex; flex-direction: column; gap: 12px; min-height: 300px; padding-bottom: 20px; }
        
        .sentence-block { 
            background: white; 
            padding: 18px 20px; 
            border-radius: 8px; 
            border: 2px solid #bdc3c7; 
            cursor: grab; 
            text-align: left; 
            font-size: 16px; 
            line-height: 1.5; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            display: flex;
            align-items: center;
            transition: border-color 0.2s, background-color 0.2s;
        }
        
        .sentence-block:active { cursor: grabbing; }

        .drag-handle {
            color: #bdc3c7;
            margin-right: 15px;
            font-size: 20px;
            cursor: grab;
        }

        .sortable-ghost { opacity: 0.4; background-color: #f0f3f4; border: 2px dashed #95a5a6; }
        .sortable-drag { box-shadow: 0 10px 20px rgba(0,0,0,0.15); cursor: grabbing !important; }
        
        .correct-anim { border-color: #27ae60 !important; background-color: #eafaf1 !important; }
        .wrong-anim { border-color: #e74c3c !important; background-color: #fdedec !important; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="setupScreen" class="setup-screen active">
        <h1>Paragraph Scrambler</h1>
        <p>Drag and drop the sentences to build a perfectly cohesive academic paragraph.</p>
        
        <div class="setup-controls">
            <div class="input-group">
                <label for="bandSelect">Difficulty Band:</label>
                <select id="bandSelect">
                    <option value="all">All Bands (Mixed)</option>
                    <option value="5.5">Band 5.5 - 6.0 (Basic)</option>
                    <option value="7.0">Band 6.5 - 7.0 (Intermediate)</option>
                    <option value="7.5">Band 7.5+ (Advanced)</option>
                </select>
            </div>

            <div class="input-group" style="margin-top: 10px;">
                <label for="questionCount">Number of Paragraphs:</label>
                <input type="number" id="questionCount" value="5" min="1" max="20">
            </div>
            
            <button onclick="startGame()" style="margin-top: 20px;">Start Drill</button>
            <button onclick="window.location.href='index.html'" style="background-color: #95a5a6; margin-top: 10px;">Back to Menu</button>
        </div>
    </div>

    <div id="gameScreen" class="game-screen">
        <div class="stats">
            <span id="scoreDisplay">Score: 0</span>
            <span id="questionCounter">Paragraph: 1/5</span>
        </div>
        
        <div class="topic-display" id="topicDisplay">Topic: Loading...</div>
        <div class="instruction-text">Drag the blocks up and down to reorder them.</div>

        <div id="sortableList" class="sortable-list"></div>

        <div class="button-group">
            <button id="checkBtn" onclick="checkAnswer()">Check Paragraph</button>
            <button id="showAnswerBtn" onclick="showCorrectAnswer()">I'm Stuck (Show Answer)</button>
            <button id="nextBtn" onclick="nextQuestion()">Next Paragraph</button>
        </div>
    </div>

    <div id="endScreen" class="end-screen">
        <h1>Drill Complete</h1>
        <p id="finalScore" style="font-size: 24px; font-weight: bold;"></p>
        <p id="feedbackText"></p>
        <button onclick="resetGame()">Return to Setup</button>
        <button onclick="window.location.href='index.html'" style="background-color: #95a5a6; margin-top: 10px;">Back to Menu</button>
    </div>
</div>

<script>
    let currentPool = [];
    let currentIndex = 0;
    let score = 0;
    let originalSentences = []; 
    let sortableInstance = null; 
    
    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        if (typeof scramblerData === 'undefined' || scramblerData.length === 0) {
            alert("Error: No data found in data_scrambler.js");
            return;
        }

        const bandChoice = document.getElementById('bandSelect').value;
        let filteredPool = [...scramblerData];

        if (bandChoice !== 'all') {
            filteredPool = scramblerData.filter((item, index) => {
                const topic = item.topic.toLowerCase();
                if (bandChoice === '5.5') {
                    // Match items categorized as band 5.5-6.0 or fallback to first batch of indices
                    return topic.includes('5.5') || topic.includes('6.0') || index < 10;
                } else if (bandChoice === '7.0') {
                    // Match intermediate items
                    return topic.includes('6.5') || topic.includes('7.0') || (index >= 10 && index < 30);
                } else if (bandChoice === '7.5') {
                    // Match advanced items
                    return topic.includes('7.5') || index >= 30;
                }
                return true;
            });
            if (filteredPool.length === 0) filteredPool = [...scramblerData];
        }

        const countInput = document.getElementById('questionCount').value;
        let requestedCount = parseInt(countInput) > 0 ? parseInt(countInput) : 5;

        currentPool = shuffleArray(filteredPool).slice(0, requestedCount);
        currentIndex = 0;
        score = 0;

        document.getElementById('setupScreen').classList.remove('active');
        document.getElementById('endScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');
        
        loadParagraph();
    }

    function loadParagraph() {
        if (currentIndex >= currentPool.length) {
            endGame();
            return;
        }

        const currentPara = currentPool[currentIndex];
        document.getElementById('topicDisplay').innerText = `Topic: ${currentPara.topic}`;
        document.getElementById('scoreDisplay').innerText = `Score: ${score}`;
        document.getElementById('questionCounter').innerText = `Paragraph: ${currentIndex + 1}/${currentPool.length}`;
        
        originalSentences = [...currentPara.sentences];
        
        let shuffled;
        do {
            shuffled = shuffleArray([...originalSentences]);
        } while (JSON.stringify(shuffled) === JSON.stringify(originalSentences));

        const listEl = document.getElementById('sortableList');
        listEl.innerHTML = '';
        
        document.getElementById('checkBtn').style.display = 'block';
        document.getElementById('showAnswerBtn').style.display = 'block';
        document.getElementById('nextBtn').style.display = 'none';

        shuffled.forEach(text => {
            let div = document.createElement('div');
            div.className = 'sentence-block';
            div.innerHTML = `<span class="drag-handle">≡</span> <span class="sentence-text">${text}</span>`;
            listEl.appendChild(div);
        });

        if (sortableInstance) {
            sortableInstance.destroy();
        }
        
        sortableInstance = new Sortable(listEl, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            dragClass: 'sortable-drag',
            onStart: function (evt) {
                clearFeedback();
            }
        });
    }

    function clearFeedback() {
        const allBlocks = document.querySelectorAll('.sentence-block');
        allBlocks.forEach(b => b.classList.remove('correct-anim', 'wrong-anim'));
    }

    function showCorrectAnswer() {
        const listEl = document.getElementById('sortableList');
        listEl.innerHTML = '';

        originalSentences.forEach(text => {
            let div = document.createElement('div');
            div.className = 'sentence-block correct-anim';
            div.innerHTML = `<span class="drag-handle">✓</span> <span class="sentence-text">${text}</span>`;
            listEl.appendChild(div);
        });

        sortableInstance.options.disabled = true;

        document.getElementById('checkBtn').style.display = 'none';
        document.getElementById('showAnswerBtn').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'block';
    }

    function checkAnswer() {
        const listEl = document.getElementById('sortableList');
        const userBlocks = listEl.children;
        let allCorrect = true;

        clearFeedback(); 

        for (let i = 0; i < userBlocks.length; i++) {
            let blockText = userBlocks[i].querySelector('.sentence-text').innerText;
            
            if (blockText === originalSentences[i]) {
                userBlocks[i].classList.add('correct-anim');
            } else {
                userBlocks[i].classList.add('wrong-anim');
                allCorrect = false;
            }
        }

        if (allCorrect) {
            score++;
            document.getElementById('checkBtn').style.display = 'none';
            document.getElementById('showAnswerBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
            
            sortableInstance.options.disabled = true;
            
            for(let i = 0; i < userBlocks.length; i++) { 
                userBlocks[i].querySelector('.drag-handle').innerText = '✓';
                userBlocks[i].style.cursor = 'default';
            }
        }
    }

    function nextQuestion() {
        currentIndex++;
        loadParagraph();
    }

    function endGame() {
        document.getElementById('gameScreen').classList.remove('active');
        document.getElementById('endScreen').classList.add('active');
        
        const percentage = (score / currentPool.length) * 100;
        document.getElementById('finalScore').innerText = `${score} out of ${currentPool.length} (${percentage.toFixed(0)}%)`;
        
        let feedback = "";
        if (percentage === 100) feedback = "Flawless! You perfectly understand English academic cohesion.";
        else if (percentage >= 60) feedback = "Good effort. Take your time to read the paragraph slowly after 'Checking' to see why the red sentences failed.";
        else feedback = "We need to practice essay structuring. Look for clues like 'However', 'Therefore', and 'For instance'.";
        document.getElementById('feedbackText').innerText = feedback;
    }

    function resetGame() {
        document.getElementById('endScreen').classList.remove('active');
        document.getElementById('setupScreen').classList.add('active');
    }
</script>

</body>
</html>
