<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Spelling & Dictation Sprint</title>
    <script src="papaparse.min.js"></script>
    <script src="data.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 { color: #2c3e50; margin-top: 0; text-align: center; }
        .setup-screen, .game-screen, .end-screen { display: none; }
        .active { display: block; }
        
        .setup-controls { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; align-items: center; }
        .selection-controls { display: flex; gap: 10px; width: 100%; max-width: 400px; margin-bottom: -5px; }
        .btn-small { flex: 1; padding: 8px; font-size: 14px; margin: 0; background-color: #7f8c8d; border: none; color: white; border-radius: 4px; cursor: pointer;}
        .btn-small:hover { background-color: #636e72; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; max-height: 250px; overflow-y: auto; }
        .checkbox-label { display: flex; align-items: center; font-size: 16px; cursor: pointer; padding: 5px 0; }
        .checkbox-label input { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
        
        .input-group { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
        .input-group label { font-weight: bold; margin-bottom: 5px; text-align: center; }
        input[type="number"] { padding: 10px; font-size: 16px; width: 100%; border: 1px solid #ccc; border-radius: 6px; text-align: center; }
        
        button.start-btn { background-color: #9b59b6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s ease; width: 100%; max-width: 300px; display: block; margin: 10px auto 0 auto; font-weight: bold;}
        button.start-btn:hover { background-color: #8e44ad; }
        button.menu-btn { background-color: #95a5a6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; max-width: 300px; display: block; margin: 10px auto 0 auto; font-weight: bold;}
        button.menu-btn:hover { background-color: #7f8c8d; }

        /* TTS Audio Buttons */
        .audio-controls { background: #fdfbf7; padding: 30px; border-left: 5px solid #9b59b6; border-radius: 8px; margin: 20px 0; text-align: center; }
        .audio-btn { background-color: #9b59b6; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold;}
        .audio-btn:hover { background-color: #8e44ad; transform: scale(1.02); }
        .context-btn { background-color: #34495e; font-size: 14px; padding: 10px 20px; }
        .context-btn:hover { background-color: #2c3e50; }

        /* The Typing Input */
        .typing-input { font-size: 24px; padding: 15px; width: 100%; max-width: 400px; border: 2px solid #bdc3c7; border-radius: 8px; text-align: center; margin: 10px auto 30px auto; display: block; transition: border 0.3s; box-sizing: border-box;}
        .typing-input:focus { border-color: #9b59b6; outline: none; box-shadow: 0 0 8px rgba(155, 89, 182, 0.3); }

        .timer-wrapper { margin: 15px 0; width: 100%; }
        .timer-bar-container { width: 100%; height: 12px; background-color: #ecf0f1; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        .timer-bar { height: 100%; width: 100%; background-color: #9b59b6; transition: width 0.1s linear; }
        .timer-display { font-size: 18px; font-weight: bold; color: #7f8c8d; text-align: right; }
        
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; color: #7f8c8d; }
        
        .review-container { margin-top: 30px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 20px; max-height: 400px; overflow-y: auto; text-align: left; }
        .review-item { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #ecf0f1; }
        .review-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .review-q { margin-bottom: 8px; font-size: 16px; color: #2c3e50; }
        .review-ans { font-size: 15px; margin: 4px 0; }
        .correct-text { color: #27ae60; font-weight: bold; }
        .incorrect-text { color: #c0392b; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="setupScreen" class="setup-screen active">
        <h1>Spelling & Dictation Sprint</h1>
        <p style="text-align: center; color: #7f8c8d;">Listen to the audio and spell the target word accurately.</p>
        <div class="setup-controls">
            
            <label style="font-weight: bold;">Select Topics to Mix:</label>
            <div class="selection-controls">
                <button type="button" class="btn-small" onclick="selectAllTopics()">Select All</button>
                <button type="button" class="btn-small" onclick="deselectAllTopics()">Deselect All</button>
            </div>

            <div id="checkboxContainer" class="checkbox-group">
                <!-- Checkboxes populated via JS -->
            </div>
            
            <div class="input-group" style="margin-top: 10px;">
                <label for="questionCount">Number of Words (Max):</label>
                <input type="number" id="questionCount" value="10" min="1">
            </div>

            <div class="input-group">
                <label for="timeInput">Time per Word (Sec):</label>
                <input type="number" id="timeInput" value="15" min="2" max="60">
            </div>
            
            <button class="start-btn" onclick="startGame()">Start Drill</button>
            <button class="menu-btn" onclick="window.location.href='index.html'">Back to Menu</button>
        </div>
    </div>

    <div id="gameScreen" class="game-screen">
        <div class="stats">
            <span id="scoreDisplay">Score: 0</span>
            <span id="questionCounter">Word: 1/10</span>
        </div>
        
        <div class="timer-wrapper">
            <div class="timer-bar-container">
                <div id="timerBar" class="timer-bar"></div>
            </div>
            <div class="timer-display" id="timerDisplay">15.0s</div>
        </div>

        <!-- The Audio Controls replaced the visual text -->
        <div class="audio-controls" id="audioControls">
            <div style="margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #2c3e50;">Listen to the audio and spell the word:</div>
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button type="button" id="playWordBtn" class="audio-btn">🔊 Play Word</button>
                <button type="button" id="playContextBtn" class="audio-btn context-btn">🔈 Play Sentence Context</button>
            </div>
        </div>
        
        <input type="text" id="answerInput" class="typing-input" placeholder="Type here and press Enter..." autocomplete="off">
        
    </div>

    <div id="endScreen" class="end-screen">
        <h1>Drill Complete</h1>
        <p id="finalScore" style="text-align: center; font-size: 24px; font-weight: bold; margin: 10px 0;"></p>
        <p id="feedbackText" style="text-align: center; margin-bottom: 20px;"></p>
        
        <button class="start-btn" onclick="resetGame()">Try Again</button>
        <button class="menu-btn" onclick="window.location.href='index.html'">Back to Menu</button>

        <div id="reviewSection" class="review-container">
            <h3 style="margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 10px;">Dictation Review</h3>
            <div id="reviewList"></div>
        </div>
    </div>
</div>

<script>
    let spellingBanks = {};
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let globalTimeLimit = 15;
    let timeLeft = 15;
    let timerInterval;
    let sessionHistory = []; 
    
    let activeCorrectAnswer = "";
    let activeContextSentence = "";

    let englishVoices = [];
    let currentQuestionVoice = null;

    window.onload = function() {
        if (typeof spellingCSVData === 'undefined') {
            alert("Error: Could not find spellingCSVData in data.js");
            return;
        }

        Papa.parse(spellingCSVData, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(row => {
                    if (!row.Category || !row.Sentence) return; 
                    
                    if (!spellingBanks[row.Category]) {
                        spellingBanks[row.Category] = [];
                    }
                    
                    spellingBanks[row.Category].push({ rawSentence: row.Sentence });
                });
                buildMenu();
            }
        });
    };

    function buildMenu() {
        const container = document.getElementById('checkboxContainer');
        container.innerHTML = ''; 
        
        for (const bankName in spellingBanks) {
            const label = document.createElement('label');
            label.className = 'checkbox-label';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = bankName;
            checkbox.checked = true; 
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(bankName));
            container.appendChild(label);
        }
    }

    function selectAllTopics() {
        document.querySelectorAll('#checkboxContainer input[type="checkbox"]').forEach(cb => cb.checked = true);
    }

    function deselectAllTopics() {
        document.querySelectorAll('#checkboxContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
    }

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    // Load available voices from the browser/OS
    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        // Filter strictly for English accents (GB, AU, US, IE, ZA, etc.)
        englishVoices = voices.filter(voice => voice.lang.startsWith('en'));
    }

    // Browsers load voices asynchronously, so we must listen for them to be ready
    window.speechSynthesis.onvoiceschanged = loadVoices;

    // NEW: Upgraded Text-to-Speech Function
    function speakText(text, rate = 0.85) {
        window.speechSynthesis.cancel(); // Stop any currently playing audio
        const utterance = new SpeechSynthesisUtterance(text);
        
        // Use the voice locked in for this specific question
        if (currentQuestionVoice) {
            utterance.voice = currentQuestionVoice;
        } else {
            // Fallback if the browser fails to map voices
            utterance.lang = 'en-GB'; 
        }
        
        utterance.rate = rate; // Slightly slower for dictation clarity
        window.speechSynthesis.speak(utterance);
    }

    function startGame() {
        const checkboxes = document.querySelectorAll('#checkboxContainer input[type="checkbox"]:checked');
        if (checkboxes.length === 0) {
            alert("Please select at least one topic.");
            return;
        }

        let combinedQuestions = [];
        checkboxes.forEach(cb => {
            combinedQuestions = combinedQuestions.concat(spellingBanks[cb.value]);
        });

        const timeInput = document.getElementById('timeInput').value;
        globalTimeLimit = parseInt(timeInput) > 0 ? parseInt(timeInput) : 15;
        
        const countInput = document.getElementById('questionCount').value;
        let requestedCount = parseInt(countInput) > 0 ? parseInt(countInput) : 10;

        score = 0;
        currentQuestionIndex = 0;
        sessionHistory = []; 
        
        currentQuestions = shuffleArray([...combinedQuestions]).slice(0, requestedCount);
        
        document.getElementById('setupScreen').classList.remove('active');
        document.getElementById('endScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');
        
        loadQuestion();
    }

    function loadQuestion() {
        clearInterval(timerInterval);
        window.speechSynthesis.cancel(); // Flush any pending speech
        
        if (currentQuestionIndex >= currentQuestions.length) {
            endGame();
            return;
        }
        if (englishVoices.length === 0) loadVoices(); // Backup check
        if (englishVoices.length > 0) {
            currentQuestionVoice = englishVoices[Math.floor(Math.random() * englishVoices.length)];
        } else {
            currentQuestionVoice = null;
        }

        const currentQ = currentQuestions[currentQuestionIndex];
        const regex = /\[(.*?)\]/;
        const match = currentQ.rawSentence.match(regex);
        
        if (match) {
            activeCorrectAnswer = match[1].trim().toLowerCase();
            // Remove brackets for the context reading
            activeContextSentence = currentQ.rawSentence.replace('[', '').replace(']', '');
            
            // Bind the audio buttons dynamically
            document.getElementById('playWordBtn').onclick = () => speakText(activeCorrectAnswer, 0.85);
            document.getElementById('playContextBtn').onclick = () => speakText(activeContextSentence, 0.95);

            // Auto-play the target word after a slight delay to ensure UI loads
            setTimeout(() => speakText(activeCorrectAnswer, 0.85), 400);

        } else {
            // Fallback error handler
            activeCorrectAnswer = "";
            activeContextSentence = currentQ.rawSentence;
        }

        document.getElementById('scoreDisplay').innerText = `Score: ${score}`;
        document.getElementById('questionCounter').innerText = `Word: ${currentQuestionIndex + 1}/${currentQuestions.length}`;
        
        // Reset and Focus Input
        const inputField = document.getElementById('answerInput');
        inputField.value = "";
        inputField.focus();

        timeLeft = globalTimeLimit;
        document.getElementById('timerDisplay').innerText = timeLeft.toFixed(1) + "s";
        document.getElementById('timerBar').style.width = "100%";
        
        timerInterval = setInterval(updateTimer, 100);
    }

    function updateTimer() {
        timeLeft -= 0.1;
        document.getElementById('timerDisplay').innerText = Math.max(0, timeLeft).toFixed(1) + "s";
        const percentage = (timeLeft / globalTimeLimit) * 100;
        document.getElementById('timerBar').style.width = `${Math.max(0, percentage)}%`;
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            processAnswer("Timed Out");
        }
    }

    // Listen for the "Enter" key on the text box
    document.getElementById('answerInput').addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            clearInterval(timerInterval);
            processAnswer(this.value);
        }
    });

    function processAnswer(userInput) {
        window.speechSynthesis.cancel(); // Stop audio immediately if they submit fast

        const cleanInput = userInput.trim().toLowerCase();
        const isCorrect = (cleanInput === activeCorrectAnswer);
        
        if (isCorrect) score++;

        // For the review screen, format the sentence with bold text instead of brackets
        const reviewSentenceHtml = currentQuestions[currentQuestionIndex].rawSentence.replace(/\[(.*?)\]/, "<b>$1</b>");

        sessionHistory.push({
            question: reviewSentenceHtml,
            userAnswer: userInput === "" ? "Left Blank" : userInput,
            correctAnswer: activeCorrectAnswer,
            isCorrect: isCorrect
        });

        currentQuestionIndex++;
        loadQuestion();
    }

    function endGame() {
        window.speechSynthesis.cancel();
        document.getElementById('gameScreen').classList.remove('active');
        document.getElementById('endScreen').classList.add('active');
        
        const percentage = (score / currentQuestions.length) * 100;
        document.getElementById('finalScore').innerText = `${score} out of ${currentQuestions.length} (${percentage.toFixed(0)}%)`;
        
        let feedback = "";
        if (percentage >= 90) feedback = "Excellent! Your auditory spelling reflexes are highly accurate.";
        else if (percentage >= 70) feedback = "Good job, but you lost points to minor typos. Listen closely for double letters.";
        else feedback = "We need to drill these words more. If you mishear one letter, you lose the IELTS listening mark!";
        document.getElementById('feedbackText').innerText = feedback;
        
        // Tracking Logic
        const trackingEnabled = localStorage.getItem("ielts_tracking_enabled") === "true";

        if (trackingEnabled) {
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwAUYzRONdG5foqJ395nLu_0jAhNz1DgREUyTttFw5fBmGvzcpgHyJxtruXyIJiM7w76w/exec";
            const studentName = localStorage.getItem("ielts_student_name") || "Anonymous";
            const dateNow = new Date().toISOString();
            const finalPercentage = Math.round((score / currentQuestions.length) * 100);

            let localHistory = JSON.parse(localStorage.getItem("ielts_local_history")) || [];
            localHistory.push({
                date: dateNow,
                drill: "Spelling", 
                score: score,
                maxScore: currentQuestions.length,
                percentage: finalPercentage
            });
            localStorage.setItem("ielts_local_history", JSON.stringify(localHistory));

            let mistakesLog = "No mistakes logged.";
            if (typeof sessionHistory !== 'undefined') {
                mistakesLog = sessionHistory
                    .filter(item => !item.isCorrect)
                    // We remove the HTML tags for the Google Sheets raw text log
                    .map(item => item.correctAnswer + " (typed: " + item.userAnswer + ")")
                    .join(" | ");
            }

            let payload = {
                studentName: studentName,
                drillName: "Spelling", 
                contentType: "Dictation Mode",
                timeLimit: globalTimeLimit + "s",
                score: score,
                maxScore: currentQuestions.length,
                percentage: finalPercentage,
                mistakes: mistakesLog
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Remote tracking failed:", err));
        }

        generateReviewSection();
    }

    function generateReviewSection() {
        const reviewList = document.getElementById('reviewList');
        reviewList.innerHTML = ''; 

        sessionHistory.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'review-item';
            
            const qText = `<div class="review-q">${index + 1}. ${item.question}</div>`;
            
            let ansText = '';
            if (item.isCorrect) {
                ansText = `<div class="review-ans">Your Answer: <span class="correct-text">${item.userAnswer}</span> (Correct)</div>`;
            } else {
                ansText = `
                    <div class="review-ans">Your Answer: <span class="incorrect-text">${item.userAnswer}</span></div>
                    <div class="review-ans">Correct Answer: <span class="correct-text">${item.correctAnswer}</span></div>
                `;
            }

            div.innerHTML = qText + ansText;
            reviewList.appendChild(div);
        });
    }

    function resetGame() {
        document.getElementById('endScreen').classList.remove('active');
        document.getElementById('setupScreen').classList.add('active');
    }
</script>

</body>
</html>
