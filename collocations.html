<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Connections</title>
    <script src="data_collocations.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; align-items: center; padding: 50px 20px; margin: 0; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; text-align: center; }
        h1 { color: #2c3e50; margin-top: 0; }
        .setup-screen, .game-screen, .end-screen { display: none; }
        .active { display: block; }
        
        .setup-controls { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; align-items: center; }
        .input-group { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
        .input-group label { font-weight: bold; margin-bottom: 5px; text-align: center; color: #2c3e50;}
        input[type="number"] { padding: 10px; font-size: 16px; width: 100%; border: 1px solid #ccc; border-radius: 6px; text-align: center; }

        button { background-color: #8e44ad; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.3s ease; width: 100%; max-width: 300px; display: block; margin: 10px auto; font-weight: bold; }
        button:hover { background-color: #732d91; }

        .timer-wrapper { margin: 15px 0; width: 100%; }
        .timer-bar-container { width: 100%; height: 12px; background-color: #ecf0f1; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        .timer-bar { height: 100%; width: 100%; background-color: #8e44ad; transition: width 0.1s linear; }
        .timer-display { font-size: 18px; font-weight: bold; color: #7f8c8d; text-align: right; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; color: #7f8c8d; }
        .instruction-text { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; font-style: italic; }

        /* The Split Screen Grid */
        .board { display: flex; justify-content: space-between; gap: 20px; margin-top: 20px; }
        .column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .col-header { font-weight: bold; color: #2c3e50; margin-bottom: 10px; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px;}
        
        .word-btn { 
            background-color: #fdfbf7; 
            border: 2px solid #bdc3c7; 
            border-radius: 8px; 
            padding: 15px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.2s; 
            text-align: center;
            user-select: none;
        }
        .word-btn:hover { border-color: #8e44ad; background-color: #f4e8f9; }
        
        /* Interaction States */
        .selected { background-color: #8e44ad !important; color: white !important; border-color: #732d91 !important; transform: scale(1.02); }
        .matched { background-color: #27ae60 !important; color: white !important; border-color: #2ecc71 !important; cursor: default; opacity: 0.8; transform: scale(1); }
        .wrong { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; }

        /* Enhanced Review Screen Styles */
        .review-container { margin-top: 30px; display: flex; flex-direction: column; gap: 20px; text-align: left; max-height: 500px; overflow-y: auto; padding-right: 10px; }
        .review-category { background: #fdfbf7; border: 1px solid #ddd; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .review-category h3 { margin-top: 0; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; font-size: 18px; }
        
        .cat-perfect h3 { color: #27ae60; border-color: #27ae60; }
        .cat-struggled h3 { color: #e67e22; border-color: #e67e22; }
        .cat-missed h3 { color: #c0392b; border-color: #c0392b; }
        
        .review-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; font-size: 16px; }
        .review-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .colloc-correct { font-weight: bold; color: #2c3e50; }
        .colloc-wrong { color: #e74c3c; font-size: 14px; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="setupScreen" class="setup-screen active">
        <h1>Connections Drill</h1>
        <p>Sound natural. Connect the Verb to its correct Noun partner to build Band 7+ vocabulary chunks.</p>
        
        <div class="setup-controls">
            <div class="input-group" style="margin-top: 10px;">
                <label for="boardCount">Number of Boards (5 pairs per board):</label>
                <input type="number" id="boardCount" value="5" min="1">
            </div>

            <div class="input-group">
                <label for="timeInput">Time per Board (Sec):</label>
                <input type="number" id="timeInput" value="30" min="10" max="120">
            </div>
            
            <button onclick="startGame()" style="margin-top: 20px;">Start Connector</button>
            <button onclick="window.location.href='index.html'" style="background-color: #95a5a6; margin-top: 10px;">Back to Menu</button>
        </div>
    </div>

    <div id="gameScreen" class="game-screen">
        <div class="stats">
            <span id="scoreDisplay">Score: 0</span>
            <span id="boardCounter">Board: 1/5</span>
        </div>
        
        <div class="timer-wrapper">
            <div class="timer-bar-container">
                <div id="timerBar" class="timer-bar"></div>
            </div>
            <div class="timer-display" id="timerDisplay">30.0s</div>
        </div>
        <div class="instruction-text">Click a Verb, then click the matching Noun.</div>

        <div class="board">
            <div class="column">
                <div class="col-header">Verbs</div>
                <div id="verbCol"></div>
            </div>
            <div class="column">
                <div class="col-header">Nouns</div>
                <div id="nounCol"></div>
            </div>
        </div>
    </div>

    <div id="endScreen" class="end-screen">
        <h1>Connector Complete</h1>
        <p id="finalScore" style="font-size: 24px; font-weight: bold;"></p>
        <p id="feedbackText"></p>
        <button onclick="resetGame()">Return to Setup</button>
        <button onclick="window.location.href='index.html'" style="background-color: #95a5a6; margin-top: 10px;">Back to Menu</button>

        <div id="reviewSection" class="review-container">
            <!-- JavaScript will inject the categorized review data here -->
        </div>
    </div>
</div>

<script>
    let activeData = [];
    let currentBoardIndex = 0;
    let totalBoards = 5;
    let score = 0; // Total correct pairs
    let totalPossibleScore = 0;
    
    let globalTimeLimit = 30; 
    let timeLeft = 30;
    let timerInterval;

    let selectedVerbBtn = null;
    let selectedNounBtn = null;
    let matchesOnCurrentBoard = 0;

    // Tracking arrays for the review screen
    let sessionHistory = [];
    let currentBoardPairs = [];

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        if (typeof collocationData === 'undefined' || collocationData.length === 0) {
            alert("Error: No data found in data_collocations.js");
            return;
        }

        const timeInput = document.getElementById('timeInput').value;
        globalTimeLimit = parseInt(timeInput) > 0 ? parseInt(timeInput) : 30;
        
        const countInput = document.getElementById('boardCount').value;
        totalBoards = parseInt(countInput) > 0 ? parseInt(countInput) : 5;
        
        const maxBoards = Math.floor(collocationData.length / 5);
        if (totalBoards > maxBoards) totalBoards = maxBoards;

        const shuffledData = shuffleArray([...collocationData]);
        activeData = shuffledData.slice(0, totalBoards * 5);

        currentBoardIndex = 0;
        score = 0;
        totalPossibleScore = totalBoards * 5;
        sessionHistory = [];

        document.getElementById('setupScreen').classList.remove('active');
        document.getElementById('endScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');
        
        loadBoard();
    }

    function loadBoard() {
        clearInterval(timerInterval);
        
        if (currentBoardIndex >= totalBoards) {
            endGame();
            return;
        }

        matchesOnCurrentBoard = 0;
        selectedVerbBtn = null;
        selectedNounBtn = null;

        document.getElementById('scoreDisplay').innerText = `Score: ${score}`;
        document.getElementById('boardCounter').innerText = `Board: ${currentBoardIndex + 1}/${totalBoards}`;
        
        const startIndex = currentBoardIndex * 5;
        const currentPairs = activeData.slice(startIndex, startIndex + 5);

        // Track the current board's data for the review screen
        currentBoardPairs = currentPairs.map(p => ({
            verb: p.verb,
            noun: p.noun,
            mistakes: [],
            matched: false
        }));

        let verbs = currentPairs.map(p => ({ text: p.verb, id: p.noun }));
        let nouns = currentPairs.map(p => ({ text: p.noun, id: p.noun })); 

        verbs = shuffleArray(verbs);
        nouns = shuffleArray(nouns);

        const verbCol = document.getElementById('verbCol');
        const nounCol = document.getElementById('nounCol');
        verbCol.innerHTML = '';
        nounCol.innerHTML = '';

        verbs.forEach(v => {
            let btn = document.createElement('div');
            btn.className = 'word-btn';
            btn.innerText = v.text;
            btn.dataset.id = v.id; 
            btn.dataset.type = 'verb';
            btn.onclick = () => handleSelect(btn);
            verbCol.appendChild(btn);
        });

        nouns.forEach(n => {
            let btn = document.createElement('div');
            btn.className = 'word-btn';
            btn.innerText = n.text;
            btn.dataset.id = n.id;
            btn.dataset.type = 'noun';
            btn.onclick = () => handleSelect(btn);
            nounCol.appendChild(btn);
        });

        timeLeft = globalTimeLimit;
        document.getElementById('timerDisplay').innerText = timeLeft.toFixed(1) + "s";
        document.getElementById('timerBar').style.width = "100%";
        
        timerInterval = setInterval(updateTimer, 100);
    }

    function updateTimer() {
        timeLeft -= 0.1;
        document.getElementById('timerDisplay').innerText = Math.max(0, timeLeft).toFixed(1) + "s";
        document.getElementById('timerBar').style.width = `${Math.max(0, (timeLeft / globalTimeLimit) * 100)}%`;
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            
            // Push current board results to history when time runs out
            sessionHistory.push(...currentBoardPairs);

            currentBoardIndex++;
            loadBoard(); 
        }
    }

    function handleSelect(btn) {
        if (btn.classList.contains('matched')) return;

        if (btn === selectedVerbBtn) {
            selectedVerbBtn.classList.remove('selected');
            selectedVerbBtn = null;
            return;
        }
        if (btn === selectedNounBtn) {
            selectedNounBtn.classList.remove('selected');
            selectedNounBtn = null;
            return;
        }

        if (btn.dataset.type === 'verb') {
            if (selectedVerbBtn) selectedVerbBtn.classList.remove('selected');
            selectedVerbBtn = btn;
            selectedVerbBtn.classList.add('selected');
        } else {
            if (selectedNounBtn) selectedNounBtn.classList.remove('selected');
            selectedNounBtn = btn;
            selectedNounBtn.classList.add('selected');
        }

        if (selectedVerbBtn && selectedNounBtn) {
            checkMatch();
        }
    }

    function checkMatch() {
        const vBtn = selectedVerbBtn;
        const nBtn = selectedNounBtn;

        // Find the tracker object for this verb
        let trackerPair = currentBoardPairs.find(p => p.verb === vBtn.innerText);

        if (vBtn.dataset.id === nBtn.dataset.id) {
            // Correct Match
            score++;
            matchesOnCurrentBoard++;
            
            if (trackerPair) trackerPair.matched = true;
            
            vBtn.className = 'word-btn matched';
            nBtn.className = 'word-btn matched';
            
            vBtn.onclick = null;
            nBtn.onclick = null;

            document.getElementById('scoreDisplay').innerText = `Score: ${score}`;

            if (matchesOnCurrentBoard === 5) {
                clearInterval(timerInterval);
                
                // Push current board results to history
                sessionHistory.push(...currentBoardPairs);

                setTimeout(() => {
                    currentBoardIndex++;
                    loadBoard();
                }, 800); 
            }

        } else {
            // Wrong Match
            if (trackerPair) trackerPair.mistakes.push(nBtn.innerText);

            vBtn.classList.remove('selected');
            vBtn.classList.add('wrong');
            nBtn.classList.remove('selected');
            nBtn.classList.add('wrong');

            setTimeout(() => {
                vBtn.classList.remove('wrong');
                nBtn.classList.remove('wrong');
            }, 400); 
        }

        selectedVerbBtn = null;
        selectedNounBtn = null;
    }

    function endGame() {
        document.getElementById('gameScreen').classList.remove('active');
        document.getElementById('endScreen').classList.add('active');
        
        const percentage = (score / totalPossibleScore) * 100;
        document.getElementById('finalScore').innerText = `${score} out of ${totalPossibleScore} pairs (${percentage.toFixed(0)}%)`;
        
        let feedback = "";
        if (percentage >= 90) feedback = "Excellent! You are building highly natural, native-sounding sentences.";
        else if (percentage >= 70) feedback = "Good effort. Watch out for direct translations from Japanese that don't quite fit English.";
        else feedback = "We need to study vocabulary in chunks, not single words. Review your mistakes below!";
        document.getElementById('feedbackText').innerText = feedback;

        const trackingEnabled = localStorage.getItem("ielts_tracking_enabled") === "true";

        if (trackingEnabled) {
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwAUYzRONdG5foqJ395nLu_0jAhNz1DgREUyTttFw5fBmGvzcpgHyJxtruXyIJiM7w76w/exec"; 
            const studentName = localStorage.getItem("ielts_student_name") || "Anonymous";
            const dateNow = new Date().toISOString();
            const finalPercentage = Math.round((score / totalPossibleScore) * 100); 

            // Format mistakes for the tutor's Google Sheet
            let mistakesLog = "No mistakes logged.";
            if (typeof sessionHistory !== 'undefined' && sessionHistory.length > 0) {
                const errors = sessionHistory.filter(item => !item.matched || item.mistakes.length > 0);
                if (errors.length > 0) {
                    mistakesLog = errors.map(item => {
                        if (!item.matched) return `${item.verb} (Timed out)`;
                        return `${item.verb} (Wrong clicks: ${item.mistakes.join(', ')})`;
                    }).join(" | ");
                }
            }

            // Send Remotely to Tutor's Google Sheet
            let payload = {
                studentName: studentName,
                drillName: "Collocation Connector", 
                contentType: "Standard Run",
                timeLimit: globalTimeLimit + "s",
                score: score,
                maxScore: totalPossibleScore, 
                percentage: finalPercentage,
                mistakes: mistakesLog
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log("Remote tracking failed:", err));
        }

        generateReviewSection();
    }

    function generateReviewSection() {
        const reviewSection = document.getElementById('reviewSection');
        reviewSection.innerHTML = '<h2 style="margin-top: 0; color: #2c3e50; text-align: center;">Performance Review</h2>'; 

        const perfect = sessionHistory.filter(item => item.matched && item.mistakes.length === 0);
        const struggled = sessionHistory.filter(item => item.matched && item.mistakes.length > 0);
        const missed = sessionHistory.filter(item => !item.matched);

        if (perfect.length > 0) {
            let html = `<div class="review-category cat-perfect"><h3>✅ Perfect Matches</h3>`;
            perfect.forEach(item => {
                html += `<div class="review-item"><span class="colloc-correct">${item.verb} + ${item.noun}</span></div>`;
            });
            html += `</div>`;
            reviewSection.innerHTML += html;
        }

        if (struggled.length > 0) {
            let html = `<div class="review-category cat-struggled"><h3>⚠️ Matched (With Mistakes)</h3>`;
            struggled.forEach(item => {
                html += `<div class="review-item">
                            <div class="colloc-correct">${item.verb} + ${item.noun}</div>
                            <div class="colloc-wrong">❌ You clicked: ${item.mistakes.join(', ')}</div>
                         </div>`;
            });
            html += `</div>`;
            reviewSection.innerHTML += html;
        }

        if (missed.length > 0) {
            let html = `<div class="review-category cat-missed"><h3>❌ Missed (Timed Out)</h3>`;
            missed.forEach(item => {
                html += `<div class="review-item">
                            <div class="colloc-correct">${item.verb} + ${item.noun}</div>
                            <div class="colloc-wrong">Ran out of time before matching.</div>
                         </div>`;
            });
            html += `</div>`;
            reviewSection.innerHTML += html;
        }
    }

    function resetGame() {
        document.getElementById('endScreen').classList.remove('active');
        document.getElementById('setupScreen').classList.add('active');
    }
</script>

</body>
</html>
