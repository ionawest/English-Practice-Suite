<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Progress Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; align-items: center; padding: 50px 20px; margin: 0; }
        .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 1000px; width: 100%; text-align: left; }
        h1 { color: #2c3e50; margin-top: 0; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;}
        .back-btn { background-color: #95a5a6; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { background-color: #7f8c8d; }

        /* Filter Controls */
        .filter-panel { display: flex; gap: 20px; margin-bottom: 20px; background: #fdfbf7; padding: 20px; border-radius: 8px; border: 1px solid #ddd; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; min-width: 200px;}
        .filter-group label { font-weight: bold; color: #2c3e50; }
        .filter-group select { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #bdc3c7; outline: none; cursor: pointer; }

        /* Dynamic Average Metric Card */
        .metric-card { background: #eafaf1; border: 2px solid #27ae60; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .metric-title { font-size: 16px; color: #2c3e50; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;}
        .metric-value { font-size: 48px; font-weight: bold; color: #27ae60; line-height: 1; }

        /* Chart Area */
        .chart-container { position: relative; height: 400px; width: 100%; margin-bottom: 40px; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box;}
        
        /* History Log */
        .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 10px;}
        .history-card { background: #fff; border: 1px solid #bdc3c7; border-left: 5px solid #3498db; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .history-date { color: #7f8c8d; font-size: 14px; margin-bottom: 5px;}
        .history-title { font-weight: bold; font-size: 18px; color: #2c3e50; }
        .history-score { font-size: 20px; font-weight: bold; color: #27ae60; background: #eafaf1; padding: 5px 15px; border-radius: 20px;}

        /* UI States */
        .status-state { text-align: center; color: #7f8c8d; font-size: 18px; padding: 40px 0; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h1>My Cloud Dashboard</h1>
        <a href="index.html" class="back-btn">← Back to Hub</a>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="status-state">
        <div class="spinner"></div>
        Syncing your secure data from the cloud...
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="status-state" style="display: none;">
        No data found! Make sure you enter your name exactly as you did on your other devices.
    </div>

    <!-- Main Content -->
    <div id="dashboardContent" style="display: none;">
        <div class="filter-panel">
            <div class="filter-group">
                <label for="drillFilter">Slice by Category:</label>
                <select id="drillFilter" onchange="applyFilters()">
                    <option value="all">View All Drills</option>
                    <option value="Spelling">Spelling & Dictation Sprint</option>
                    <option value="Data">Task 1 Trend Translator</option>
                    <option value="Ideas">Task 2 Idea Sorter</option>
                    <option value="Paragraph Scrambler">Paragraph Scrambler</option>
                    <option value="Connections">Collocation Connector</option>
                    <option value="Skimming">Skim & Scan Radar</option>
                    <option value="Grammar and Reading">Micro-Grammar Sprint</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="timeFilter">Slice by Time Frame:</label>
                <select id="timeFilter" onchange="applyFilters()">
                    <option value="all">All Time</option>
                    <option value="today">Today</option>
                    <option value="7days">Last 7 Days</option>
                    <option value="30days">Last 30 Days</option>
                </select>
            </div>
        </div>

        <div class="metric-card">
            <div class="metric-title">Average Accuracy (Filtered)</div>
            <div class="metric-value" id="averageDisplay">--%</div>
        </div>

        <div class="chart-container">
            <canvas id="progressChart"></canvas>
        </div>

        <h3>Recent Activity Log</h3>
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<script>
    // --- PASTE YOUR GOOGLE APPS SCRIPT URL HERE ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwAUYzRONdG5foqJ395nLu_0jAhNz1DgREUyTttFw5fBmGvzcpgHyJxtruXyIJiM7w76w/exec"; 
    
    let chartInstance = null; 
    let cloudHistoryData = []; // Stores the fetched data globally for fast slicing

    document.addEventListener("DOMContentLoaded", () => {
        fetchCloudData();
    });

    function fetchCloudData() {
        const studentName = localStorage.getItem("ielts_student_name") || "Anonymous";
        
        // Append the student's name to the URL so the Google Sheet knows who to look for
        const fetchUrl = WEB_APP_URL + "?studentName=" + encodeURIComponent(studentName);

        fetch(fetchUrl)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loadingState').style.display = 'none';
                
                if (data.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                } else {
                    cloudHistoryData = data; // Save the data to our global array
                    document.getElementById('dashboardContent').style.display = 'block';
                    applyFilters(); // Draw the initial chart
                }
            })
            .catch(error => {
                console.error("Error fetching data:", error);
                document.getElementById('loadingState').innerHTML = "⚠️ Error syncing data. Please check your internet connection and try again.";
            });
    }

    function applyFilters() {
        const drillFilter = document.getElementById('drillFilter').value;
        const timeFilter = document.getElementById('timeFilter').value;
        
        // Slice the cloud data instead of local data
        let slicedData = cloudHistoryData;

        if (drillFilter !== 'all') {
            slicedData = cloudHistoryData.filter(item => item.drill === drillFilter);
        }

        const now = new Date();
        if (timeFilter !== 'all') {
            slicedData = slicedData.filter(item => {
                const itemDate = new Date(item.date);
                const diffTime = Math.abs(now - itemDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (timeFilter === 'today') {
                    return itemDate.toDateString() === now.toDateString();
                } else if (timeFilter === '7days') {
                    return diffDays <= 7;
                } else if (timeFilter === '30days') {
                    return diffDays <= 30;
                }
                return true;
            });
        }

        renderDashboard(slicedData, drillFilter);
    }

    function renderDashboard(data, currentDrillFilter) {
        const listContainer = document.getElementById("historyList");
        const avgDisplay = document.getElementById("averageDisplay");

        if (data.length === 0) {
            avgDisplay.innerText = "--%";
            listContainer.innerHTML = '<div style="color:#7f8c8d; padding: 15px;">No recorded plays match these filters.</div>';
            if (chartInstance) chartInstance.destroy();
            return;
        }

        const sum = data.reduce((acc, curr) => acc + curr.percentage, 0);
        const meanAverage = Math.round(sum / data.length);
        avgDisplay.innerText = meanAverage + "%";

        const labels = data.map(item => {
            const d = new Date(item.date);
            return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + 
                   d.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
        });
        
        const dataPoints = data.map(item => item.percentage);

        if (chartInstance) {
            chartInstance.destroy();
        }

        const ctx = document.getElementById('progressChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: currentDrillFilter === 'all' ? 'Overall Accuracy (%)' : `${currentDrillFilter} Accuracy (%)`,
                    data: dataPoints,
                    borderColor: '#2980b9',
                    backgroundColor: 'rgba(41, 128, 185, 0.2)',
                    borderWidth: 3,
                    pointBackgroundColor: '#2c3e50',
                    pointRadius: 6,
                    pointHoverRadius: 8,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { 
                    y: { beginAtZero: true, max: 100, title: { display: true, text: 'Score (%)' } },
                    x: { title: { display: true, text: 'Time of Attempt' }, ticks: { maxRotation: 45, minRotation: 45 } }
                },
                plugins: { legend: { position: 'top' } }
            }
        });

        listContainer.innerHTML = '';
        [...data].reverse().forEach(item => {
            let dateStr = new Date(item.date).toLocaleString();
            let card = document.createElement("div");
            card.className = "history-card";
            card.innerHTML = `
                <div>
                    <div class="history-date">${dateStr}</div>
                    <div class="history-title">${item.drill}</div>
                </div>
                <div class="history-score">${item.percentage}%</div>
            `;
            listContainer.appendChild(card);
        });
    }
</script>

</body>
</html>
